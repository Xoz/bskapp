name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bsk-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        env:
          BSK_VPS_SSH_KEY: ${{ secrets.BSK_VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$BSK_VPS_SSH_KEY" > ~/.ssh/bsk_vps_key
          chmod 600 ~/.ssh/bsk_vps_key
          ssh-keyscan -H 217.160.55.151 >> ~/.ssh/known_hosts

      - name: Publish main app independently
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/bsk_vps_key deploy/main-vps.sh root@217.160.55.151:/tmp/bsk-main-vps.sh
          ssh -i ~/.ssh/bsk_vps_key root@217.160.55.151 "bash /tmp/bsk-main-vps.sh '$DEPLOY_COMMIT'"
