# Monteras i server-blocket för bsk2014.se. BSK-sessionens cookie stannar i
# huvudappen; Planlinjen får bara en kortlivad, HMAC-signerad identitet.
location = /_bsk_coach_auth {
    internal;
    proxy_pass http://127.0.0.1:3001/api/auth/coach-bridge;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-BSK-Coach "";
    proxy_set_header X-BSK-Coach-Signature "";
}

location = /coach {
    return 308 /coach/;
}

location /coach/ {
    auth_request /_bsk_coach_auth;
    auth_request_set $bsk_coach $upstream_http_x_bsk_coach;
    auth_request_set $bsk_coach_signature $upstream_http_x_bsk_coach_signature;
    error_page 401 =302 /login;

    proxy_set_header X-BSK-Coach $bsk_coach;
    proxy_set_header X-BSK-Coach-Signature $bsk_coach_signature;
    proxy_set_header Cookie "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
    proxy_pass http://127.0.0.1:3101;
}
